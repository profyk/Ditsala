name: Mobile build (EAS)

# Manual dispatch only — an EAS build consumes build-queue minutes/credits
# on Expo's side, so this is deliberately not triggered on every push.
# Tag a release commit and run this workflow against that tag/branch.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: "EAS build profile (apps/mobile/eas.json)"
        required: true
        type: choice
        options: [development, preview, production]
        default: preview

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm@9.15.9

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: |
          eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ inputs.profile }} \
            --non-interactive \
            --no-wait
