name: Deploy backend (Railway)

# Railway is the primary backend host (see docs/CI_CD.md). This only runs
# after CI has actually passed on main — `workflow_run` rather than a
# plain `push` trigger, so a broken build/test/lint never reaches a
# deploy step at all.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli@3

      - name: Deploy to Railway
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # Targeted by service ID, not name — Railway auto-creates a
        # service with its own generated name the first time you connect
        # a GitHub repo, which is easy to end up not matching a plain
        # "backend" name guess. An ID is unambiguous. See docs/CI_CD.md §3
        # for exactly where to find it.
        run: railway up --service "${{ secrets.RAILWAY_SERVICE_ID }}" --detach
