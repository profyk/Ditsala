name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ditsala
          POSTGRES_PASSWORD: ditsala
          POSTGRES_DB: ditsala
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ditsala"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv pip install --system -e . --group dev
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy app
      - name: Run Alembic migrations
        env:
          DATABASE_URL: postgresql+asyncpg://ditsala:ditsala@localhost:5432/ditsala
        run: alembic upgrade head
      - name: Test (pytest)
        env:
          DATABASE_URL: postgresql+asyncpg://ditsala:ditsala@localhost:5432/ditsala
          REDIS_URL: redis://localhost:6379/0
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install pnpm
        run: npm install -g pnpm@9.15.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm turbo run lint
      - name: Type-check
        run: pnpm turbo run typecheck
      - name: Test
        run: pnpm turbo run test
